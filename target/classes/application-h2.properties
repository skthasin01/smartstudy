# ===================================================================
# H2 Profile Configuration (Runs out-of-the-box without PostgreSQL)
# Activate with: --spring.profiles.active=h2
# ===================================================================

server.port=8080

spring.datasource.url=jdbc:h2:file:./data/smart_study_h2;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

app.burnout.daily-study-threshold-minutes=360
app.burnout.consecutive-study-threshold-minutes=150
app.burnout.min-sleep-hours=6.0
app.burnout.high-stress-threshold=4
