# ===================================================================
# Smart Study Load and Burnout Prevention System Configuration
# ===================================================================

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# PostgreSQL Primary Database Configuration
# You can override these using environment variables:
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_study_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Spring MVC & OpenAPI / Swagger Configuration (Spring Boot 2.7 + springdoc 1.8.0)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT Authentication Security Properties
# Minimum 256-bit hexadecimal string for HMAC-SHA256
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Application Custom Defaults
app.burnout.daily-study-threshold-minutes=360
app.burnout.consecutive-study-threshold-minutes=150
app.burnout.min-sleep-hours=6.0
app.burnout.high-stress-threshold=4
